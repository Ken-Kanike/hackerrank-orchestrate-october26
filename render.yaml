# ─────────────────────────────────────────────────────────────────────────────
# Render Service Specification
# Deploys the FastAPI server for Ghost Data Auditor
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: ghost-data-auditor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
