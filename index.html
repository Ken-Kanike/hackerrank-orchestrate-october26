"\n        with open(EXPERIMENTS, \"a\", encoding=\"utf-8\") as f:\n            f.write(json.dumps({\"ts\": time.strftime(\"%Y-%m-%dT%H:%M:%SZ\", time.gmtime()), \"desc\": a.record, \"git_diff_stat\": ds,\n                                \"metrics\": rounded(m)}, ensure_ascii=False) + \"\\n\")\n        print(\"recorded ->\", EXPERIMENTS)\n\n\nif __name__ == \"__main__\":\n    main()\n", "code/evaluation/link_recovery.py": "\"\"\"Label-free evaluation of the activity-based account linker (limitations A2 / D1 / G1).\n\nFor cases whose account is proven by identity (the account record carries the subject's identifiers) we hide that link, let the\nlinker re-derive the account from workflow activity alone, and compare with the proven account. No gold file is read.\nRepeated k-fold hiding keeps the competition realistic (only 1/k of the proven accounts are free at a time).\n\nUsage: python code/evaluation/link_recovery.py [--folds 4] [--repeats 3]\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\nimport random\nimport statistics\nimport sys\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parents[1]))\nif hasattr(sys.stdout, \"reconfigure\"):\n    sys.stdout.reconfigure(encoding=\"utf-8\")\n\nfrom auditor import config  # noqa: E402\nfrom auditor.config import DATASET  # noqa: E402\nfrom auditor.engine import Engine  # noqa: E402\nfrom auditor.evidence import load_activity, load_manifest, load_observations, prefix  # noqa: E402\nfrom auditor.intent import classify_many  # noqa: E402\nfrom auditor.pipeline import read_requests  # noqa: E402\n\n\ndef recover(folds: int, repeats: int, seed: int = 7, data: Path = DATASET, progress=None):\n    reqs = read_requests(\"deletion_requests.csv\", data) + (read_requests(\"sample_deletion_requests.csv\", data) if (data / \"sample_deletion_requests.csv\").exists() else [])\n    by_text = classify_many([c[\"request_text\"] for c in reqs])\n    cases = [c for c in reqs if by_text[c[\"request_text\"]][\"final\"] == \"DELETE\"]\n    manifest, acts = load_manifest(data), load_activity(data)\n    obs = load_observations(data, manifest, acts)\n    base = Engine(data, manifest, acts, obs); base.link_all(cases)\n    proven = {cid: next(r for r in rids if prefix(r) == \"account\" and r in base.acc_event)\n              for cid, (_, rids, _) in base.info.items() if any(prefix(r) == \"account\" and r in base.acc_event for r in rids)}\n    rng = random.Random(seed); res = []\n    for _ in range(repeats):\n        ids = sorted(proven); rng.shuffle(ids)\n        for k in range(folds):\n            hide = set(ids[k::folds])\n            e = Engine(data, manifest, acts, obs); e.link_all(cases, hide_accounts=hide)\n            ok = sum(1 for cid in hide if proven[cid] in e.extra.get(cid, set()))\n            amb = sum(1 for cid in hide if cid in e.ambiguous)\n            res.append((len(hide), ok, amb))\n            if progress:\n                progress(len(res), repeats * folds)\n    return len(proven), res\n\n\ndef main():\n    ap = argparse.ArgumentParser(); ap.add_argument(\"--folds\", type=int, default=4); ap.add_argument(\"--repeats\", type=int, default=3)\n    a = ap.parse_args()\n    n, res = recover(a.folds, a.repeats)\n    acc = [ok / h for h, ok, _ in res]; amb = [m / h for h, _, m in res]\n    print(f\"identity-proven accounts: {n}; alignment={'on' if config.USE_RUN_ALIGNMENT else 'off'}; tie-break={config.TIE_BREAK}\")\n    print(f\"recovery accuracy: mean {statistics.mean(acc):.4f} +- {statistics.pstdev(acc):.4f} over {len(res)} folds; \"\n          f\"residual-ambiguity rate {statistics.mean(amb):.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()\n"}</script>

<script type="text/plain" id="worker-src">/* Engine worker: Pyodide (CPython in WebAssembly) running the real auditor package. Synchronous I/O is fine here (no UI thread). */
const PYODIDE_VERSION = "0.27.7";
let pyodide = null;
let service = null;

function post(o) { self.postMessage(o); }
function boot(step, detail) { post({ type: "boot", step, detail }); }

function mkdirp(path) {
  const parts = path.split("/").filter(Boolean);
  let cur = "";
  for (const p of parts) { cur += "/" + p; try { pyodide.FS.mkdir(cur); } catch (e) { /* exists */ } }
}

async function init(pysrc) {
  boot("runtime", "Loading Python runtime (Pyodide " + PYODIDE_VERSION + ")");
  importScripts("https://cdn.jsdelivr.net/pyodide/v" + PYODIDE_VERSION + "/full/pyodide.js");
  pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v" + PYODIDE_VERSION + "/full/" });
  boot("sources", "Installing the auditor package");
  for (const [path, text] of Object.entries(pysrc)) {
    const full = "/app/" + path;
    mkdirp(full.substring(0, full.lastIndexOf("/")));
    pyodide.FS.writeFile(full, text);
  }
  boot("deps", "Loading sqlite3 (SQL snapshot evidence)");
  await pyodide.loadPackage("sqlite3");
  let pdf = true;
  boot("deps", "Installing pypdf (PDF evidence)");
  try {
    await pyodide.loadPackage("micropip");
    await pyodide.runPythonAsync("import micropip\nawait micropip.install('pypdf')");
  } catch (e) {
    pdf = false;
    boot("deps-warn", "pypdf unavailable - PDF evidence will be skipped (" + String(e).slice(0, 120) + ")");
  }
  boot("engine", "Starting the engine");
  pyodide.runPython(`
import sys, json, js
sys.path[:0] = ['/app', '/app/code']
import browser_io
browser_io.install()
from auditor import events
def _sink(e):
    js.postMessage(json.dumps({"type": "event", "e": e}))
events.set_sink(_sink)
import service as S
`);
  if (!pdf) {
    pyodide.runPython(`
from auditor import evidence
evidence.pdf_text = lambda path: ""
`);
  }
  service = pyodide.globals.get("S");
  boot("ready", "Engine ready");
  return { pdf, python: pyodide.runPython("import sys; sys.version.split()[0]") };
}

self.onmessage = async (ev) => {
  const m = ev.data;
  try {
    let result;
    if (m.cmd === "init") result = await init(m.pysrc);
    else if (m.cmd === "write") {
      for (const f of m.files) {
        const full = "/app/data/" + f.path;
        mkdirp(full.substring(0, full.lastIndexOf("/")));
        pyodide.FS.writeFile(full, new Uint8Array(f.data));
      }
      result = m.files.length;
    } else if (m.cmd === "remove") {
      pyodide.runPython("import shutil; shutil.rmtree('/app/data/" + m.dir.replace(/[^\w\-./]/g, "") + "', ignore_errors=True)");
      result = true;
    } else if (m.cmd === "call") {
      result = service[m.fn](...m.args);
    } else throw new Error("unknown command " + m.cmd);

/* ========================================================================================
   Engine client
   ======================================================================================== */
const Engine = {
  worker: null, seq: 0, pending: new Map(), bootPromise: null, loaded: new Set(), buffer: [], raf: 0,

  start() {
    if (this.bootPromise) return this.bootPromise;
    Store.set({ engine: { status: "booting", steps: [], error: null, info: null, startedAt: Date.now() } });
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
    this.worker = new Worker(url);
    this.worker.onmessage = (e) => this._msg(e.data);
    this.worker.onerror = (e) => this._fatal("Worker crashed: " + (e.message || "unknown error"));
    this.loaded = new Set();
    this.bootPromise = this._rpc({ cmd: "init", pysrc: PYSRC }).then((info) => {
      Store.set((s) => ({ engine: { ...s.engine, status: "ready", info } }));
      return info;
    }).catch((err) => { this._fatal(err.message); throw err; });
    return this.bootPromise;
  },
  _fatal(msg) { Store.set((s) => ({ engine: { ...s.engine, status: "error", error: msg } })); },
  _rpc(m, transfer) {
    return new Promise((res, rej) => { const id = ++this.seq; this.pending.set(id, { res, rej }); this.worker.postMessage({ ...m, id }, transfer || []); });
  },
  _msg(d) {
    if (typeof d === "string") { let m; try { m = JSON.parse(d); } catch (e) { return; } if (m.type === "event") this._event(m.e); return; }
    if (d.type === "boot") { Store.set((s) => ({ engine: { ...s.engine, steps: [...s.engine.steps, { step: d.step, detail: d.detail, t: Date.now() }] } })); return; }
    const p = this.pending.get(d.id); if (!p) return; this.pending.delete(d.id);
    d.ok ? p.res(d.result) : p.rej(new Error(d.error));
  },
  _event(e) { this.buffer.push(e); if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; const b = this.buffer; this.buffer = []; applyEvents(b); }); },
  async call(fn, ...args) { await this.start(); const r = await this._rpc({ cmd: "call", fn, args }); return r; },
  async callJson(fn, ...args) { return JSON.parse(await this.call(fn, ...args)); },
  async write(files) { await this.start(); return this._rpc({ cmd: "write", files }, files.map((f) => f.data).filter((d) => d instanceof ArrayBuffer)); },
  /** Cancel = terminate the worker (a running Python call cannot be interrupted) and boot a fresh one. */
  restart() {
    try { this.worker.terminate(); } catch (e) { /* ignore */ }
    this.pending.forEach((p) => p.rej(new Error("cancelled")));
    this.pending.clear(); this.bootPromise = null; this.loaded = new Set();
    return this.start();
  },
};

function applyEvents(batch) {
  Store.set((s) => {
    const run = { ...s.run, stages: { ...s.run.stages }, logs: s.run.logs.slice(-600), llm: s.run.llm };
    for (const e of batch) {
      const t = e.t;
      if (e.kind === "stage_start") { run.stages[e.id] = { status: "running", startedAt: t, total: e.total || null, done: 0 }; run.logs.push({ t, level: "stage", msg: "▶ " + e.id + (e.total ? " (" + e.total + ")" : "") }); }
      else if (e.kind === "stage_end") {
        const { kind, t: _t, id, ms, ok, error, ...stats } = e;
        run.stages[id] = { ...(run.stages[id] || {}), status: ok ? "done" : "failed", ms, stats, error, endedAt: t, done: run.stages[id]?.total || run.stages[id]?.done };
        run.logs.push({ t, level: ok ? "stage" : "error", msg: (ok ? "✔ " : "✘ ") + id + " " + fmt.ms(ms) + (error ? " - " + error : "") });
      } else if (e.kind === "progress") {
        if (run.stages[e.stage]) run.stages[e.stage] = { ...run.stages[e.stage], done: e.done, total: e.total || run.stages[e.stage].total };
        else run.stages[e.stage] = { status: "running", startedAt: t, done: e.done, total: e.total };
        if (e.label) run.logs.push({ t, level: "info", msg: e.stage + " " + e.done + "/" + e.total + " - " + e.label });
      } else if (e.kind === "log") run.logs.push({ t, level: e.level, msg: e.msg });
      else if (e.kind === "llm") {
        run.llm = [...run.llm, e];
        run.logs.push({ t, level: "llm", msg: (e.cached ? "cache " : "call  ") + (e.provider || "-") + " " + (e.model || "") + " " + e.task + (e.ok ? "" : " FAILED") + (e.cached ? "" : " " + fmt.ms(e.ms)) + " in/out " + (e.in ?? 0) + "/" + (e.out ?? 0) });
      }
    }
    return { run };
  });
}

function normalizeFiles(entries) {
  // entries: [{path, data: ArrayBuffer}]; strip everything above the folder that holds deletion_requests.csv
  const marker = entries.filter((e) => /(^|\/)deletion_requests\.csv$/.test(e.path)).sort((a, b) => a.path.length - b.path.length)[0];
  if (!marker) return null;
  const prefix = marker.path.slice(0, marker.path.length - "deletion_requests.csv".length);
  return entries.filter((e) => e.path.startsWith(prefix)).map((e) => ({ path: e.path.slice(prefix.length), data: e.data }));
}
async function readFileList(files) {
  const out = [];
  for (const f of files) out.push({ path: (f.webkitRelativePath || f.relativePath || f.name).replace(/\\/g, "/"), data: await f.arrayBuffer() });
  return out;
}
async function readDropped(dt) {
  const items = [...(dt.items || [])].map((i) => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  const out = [];
  const walk = async (entry, base) => {
    if (entry.isFile) { const f = await new Promise((r, j) => entry.file(r, j)); out.push({ path: base + entry.name, data: await f.arrayBuffer() }); }
    else if (entry.isDirectory) {
      const rd = entry.createReader();
      let batch;
      do { batch = await new Promise((r, j) => rd.readEntries(r, j)); for (const e of batch) await walk(e, base + entry.name + "/"); } while (batch.length);
    }
  };
  for (const it of items) await walk(it, "");
  return out.length ? out : readFileList([...(dt.files || [])]);
}

const Datasets = {
  store: new Map(),   // id -> { files: [{path, data}] | zip: ArrayBuffer }
  async registerFiles(name, entries, kind) {
    const isZip = entries.length === 1 && /\.zip$/i.test(entries[0].path);
    let files = null;
    if (!isZip) {
      files = normalizeFiles(entries);
      if (!files) throw new Error("No deletion_requests.csv found. Select the dataset folder (or a .zip of it).");
    }
    const id = (kind || "ds") + "_" + uid();
    this.store.set(id, isZip ? { zip: entries[0].data } : { files });
    Store.set((s) => ({ datasets: { ...s.datasets, [id]: { id, name, kind: kind || "upload", fileCount: isZip ? null : files.length, bytes: (isZip ? entries[0].data.byteLength : files.reduce((a, f) => a + f.data.byteLength, 0)), info: null } }, activeDataset: id }));
    await this.ensure(id);
    return id;
  },
  async registerDemo(name) {
    const existing = Object.values(Store.get().datasets).find((d) => d.kind === "demo" && d.name === name);
    if (existing) { Store.set({ activeDataset: existing.id }); return existing.id; }
    const enc = new TextEncoder();
    const entries = Object.entries(DEMO[name]).map(([p, t]) => ({ path: p, data: enc.encode(t).buffer }));
    return this.registerFiles(name, entries, "demo");
  },
  async ensure(id) {
    await Engine.start();
    const rec = this.store.get(id); if (!rec) throw new Error("dataset missing");
    if (!Engine.loaded.has(id)) {
      if (rec.zip) {
        await Engine.write([{ path: id + ".zip", data: rec.zip.slice(0) }]);
        await Engine.call("unzip_to", "/app/data/" + id + ".zip", "/app/data/" + id);
      } else {
        const chunk = 40; // keep messages moderate
        for (let i = 0; i < rec.files.length; i += chunk)
          await Engine.write(rec.files.slice(i, i + chunk).map((f) => ({ path: id + "/" + f.path, data: f.data.slice(0) })));
      }
      Engine.loaded.add(id);
    }
    const info = await Engine.callJson("dataset_info", "/app/data/" + id);
    Store.set((s) => ({ datasets: { ...s.datasets, [id]: { ...s.datasets[id], info } } }));
    return info;
  },
  async fromUrl(base, name) {
    base = base.replace(/\/?$/, "/");
    const get = async (p, bin) => { const r = await fetch(base + p); if (!r.ok) throw new Error(p + " -> HTTP " + r.status); return bin ? r.arrayBuffer() : r.text(); };
    const top = ["deletion_requests.csv", "user_identities.csv", "user_audit_log.csv", "system_activity.csv", "deletion_rules.csv", "evidence_files.csv"];
    const optional = ["sample_deletion_requests.csv", "sample_output.csv", "expected_output.csv"];
    const entries = [];
    for (const f of top) entries.push({ path: f, data: await get(f, true) });
    for (const f of optional) { try { entries.push({ path: f, data: await get(f, true) }); } catch (e) { /* optional */ } }
    const man = new TextDecoder().decode(entries.find((e) => e.path === "evidence_files.csv").data).trim().split(/\r?\n/);
    const cols = man[0].split(","); const pi = cols.indexOf("file_path");
    const paths = man.slice(1).map((l) => l.split(",")[pi]);
    let done = 0;
    for (const p of paths) {
      try { entries.push({ path: p, data: await get(p, true) }); } catch (e) { /* missing evidence is reported by dataset_info */ }
      if (++done % 10 === 0) Store.set((s) => ({ engine: { ...s.engine } }));
    }
    return this.registerFiles(name || base, entries, "url");
  },
  async remove(id) {
    this.store.delete(id);
    try { await Engine.start(); await Engine._rpc({ cmd: "remove", dir: id }); Engine.loaded.delete(id); } catch (e) { /* ignore */ }
    Store.set((s) => { const d = { ...s.datasets }; delete d[id]; return { datasets: d, activeDataset: s.activeDataset === id ? null : s.activeDataset }; });
  },
};

/* ========================================================================================
   Vault - AES-GCM encrypted with a key derived (PBKDF2-SHA256, 310k iterations) from the passphrase.
   Plaintext keys exist only in this tab's memory while unlocked; they are sent to the engine worker as environment variables and to
   the provider you configured - nowhere else.
   ======================================================================================== */
const Vault = (() => {
  const KEY = "gda.vault.v1";
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let cryptoKey = null, idleTimer = null;
  const ITER = 310000;

  async function derive(pass, salt, iter) {
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(ct) };
  }
  async function open(key, box) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct));
    return JSON.parse(dec.decode(pt));
  }
  const rec = () => ls.get(KEY, null);
  const setV = (p) => Store.set((s) => ({ vault: { ...s.vault, ...p } }));
  const mask = (k) => (k ? "••••••" + k.slice(-4) : "");

  const api = {
    exists: () => !!rec(),
    init() {
      const r = rec();
      setV({ phase: r ? "locked" : "none", items: r ? r.items.map((i) => ({ id: i.id, provider: i.provider, label: i.label, base_url: i.base_url, model: i.model, vision_model: i.vision_model, secret: null })) : [] });
    },
    async create(pass) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      cryptoKey = await derive(pass, salt, ITER);
      const verifier = await seal(cryptoKey, { ok: "gda-vault" });
      const ok = ls.set(KEY, { v: 1, salt: b64(salt), iter: ITER, verifier, items: [] });
      setV({ phase: "unlocked", items: [], persistent: ok, error: ok ? null : "Browser storage unavailable: vault is memory-only." });
      api.touch();
    },
    async unlock(pass) {
      const r = rec(); if (!r) throw new Error("No vault");
      const k = await derive(pass, unb64(r.salt), r.iter);
      try { await open(k, r.verifier); } catch (e) { throw new Error("Wrong passphrase"); }
      cryptoKey = k;
      const items = [];
      for (const i of r.items) items.push({ id: i.id, provider: i.provider, label: i.label, base_url: i.base_url, model: i.model, vision_model: i.vision_model, secret: (await open(k, i.box)).key });
      setV({ phase: "unlocked", items, error: null });
      api.touch(); await api.pushEnv();
    },
    sessionOnly() { cryptoKey = null; setV({ phase: "session", items: [], persistent: false }); api.touch(); },
    async add(item) {
      const full = { id: uid(), ...item };
      const items = [...Store.get().vault.items, full];
      if (Store.get().vault.phase === "unlocked" && cryptoKey) {
        const r = rec();
        r.items.push({ id: full.id, provider: full.provider, label: full.label, base_url: full.base_url, model: full.model, vision_model: full.vision_model, box: await seal(cryptoKey, { key: full.secret }) });
        ls.set(KEY, r);
      }
      setV({ items }); await api.pushEnv();
    },
    async remove(id) {
      const r = rec(); if (r) { r.items = r.items.filter((i) => i.id !== id); ls.set(KEY, r); }
      setV({ items: Store.get().vault.items.filter((i) => i.id !== id) }); await api.pushEnv();
    },
    async lock() {
      cryptoKey = null; clearTimeout(idleTimer);
      setV({ providers: [] });                                  // UI truth first; the engine worker is cleared right after
      const r = rec();
      setV({ phase: r ? "locked" : "none", items: (r ? r.items : []).map((i) => ({ id: i.id, provider: i.provider, label: i.label, base_url: i.base_url, model: i.model, vision_model: i.vision_model, secret: null })) });
      if (Engine.bootPromise && Store.get().engine.status === "ready") { try { await Engine.call("set_env", "{}"); setV({ providers: [] }); } catch (e) { /* busy */ } }
    },
    wipe() { ls.del(KEY); cryptoKey = null; setV({ phase: "none", items: [], providers: [] }); if (Store.get().engine.status === "ready") Engine.call("set_env", "{}").catch(() => {}); },
    exportBlob() { return JSON.stringify(rec() || {}); },
    importBlob(text) { const o = JSON.parse(text); if (!o.salt || !o.verifier || !Array.isArray(o.items)) throw new Error("Not a vault export"); ls.set(KEY, o); api.init(); },
    touch() {
      clearTimeout(idleTimer);
      const m = Store.get().prefs.lockMin;
      if (m > 0 && Store.get().vault.phase === "unlocked") idleTimer = setTimeout(() => { api.lock(); toast("Vault auto-locked after " + m + " min idle", "info"); }, m * 60000);
    },
    buildEnv() {
      const env = {}, order = [];
      const by = {};
      for (const i of Store.get().vault.items) if (i.secret !== null) (by[i.provider] = by[i.provider] || []).push(i);
      for (const [prov, items] of Object.entries(by)) {
        const pre = prov.toUpperCase();
        items.forEach((it, n) => { env[`${pre}_API_KEY_${n + 1}`] = it.secret || (prov === "custom" ? "none" : ""); });
        if (items[0].model) env[`${pre}_MODEL1`] = items[0].model;
        if (items[0].vision_model) env[`${pre}_VISION_MODEL`] = items[0].vision_model;
        if (prov === "custom") env.CUSTOM_BASE_URL = items[0].base_url;
        order.push(prov);
      }
      const prio = Store.get().prefs.providerOrder || ["anthropic", "openai", "gemini", "groq", "custom"];
      env.LLM_PROVIDER_ORDER = [...prio.filter((p) => order.includes(p)), ...order.filter((p) => !prio.includes(p))].join(",");
      return env;
    },
    async pushEnv() {
      if (Store.get().engine.status !== "ready") return;
      try { const r = JSON.parse(await Engine.call("set_env", JSON.stringify(api.buildEnv()))); setV({ providers: r.providers }); } catch (e) { /* engine busy; run() pushes again */ }
    },
    mask,
  };
  return api;
})();
["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => Vault.touch(), { passive: true }));

/* ---------- global tooltip (data-tip) ---------- */
function installTooltips() {
  const el = document.createElement("div"); el.className = "tip"; el.style.display = "none"; document.body.appendChild(el);
  let cur = null;
  const show = (t, x, y) => {
    el.textContent = t; el.style.display = "block";
    const r = el.getBoundingClientRect();
    el.style.left = Math.min(innerWidth - r.width - 8, Math.max(8, x + 12)) + "px"; el.style.top = Math.min(innerHeight - r.height - 8, y + 14) + "px";
  };
  document.addEventListener("pointermove", (e) => {
    const t = e.target.closest ? e.target.closest("[data-tip]") : null;
    if (t && t.getAttribute("data-tip")) { cur = t; show(t.getAttribute("data-tip"), e.clientX, e.clientY); } else if (cur) { cur = null; el.style.display = "none"; }
  });
  document.addEventListener("pointerleave", () => { el.style.display = "none"; });
  document.addEventListener("scroll", () => { el.style.display = "none"; }, true);
}

/* ---------- charts ---------- */
function StackBar({ parts, height = 10 }) {
  const total = parts.reduce((a, p) => a + p.value, 0) || 1;
  return html`<div class="bar" style=${"height:" + height + "px"} role="img" aria-label=${parts.map((p) => p.label + " " + p.value).join(", ")}>${parts.filter((p) => p.value > 0).map((p) => html`<i style=${`width:${(p.value / total) * 100}%;background:${p.color}`} data-tip=${p.label + ": " + p.value + " (" + fmt.pct(p.value / total) + ")"}></i>`)}</div>`;
}
function Legend({ items }) { return html`<div class="legend">${items.map((i) => html`<span><i style=${"background:" + i.color}></i>${i.label}${i.value != null ? " " + i.value : ""}</span>`)}</div>`; }
function HBars({ rows, max, fmtv = (v) => v, unit }) {
  const m = max || Math.max(1, ...rows.map((r) => r.value));
  return html`<div class="col" style="gap:9px">${rows.map((r) => html`<div data-tip=${r.tip || r.label + ": " + fmtv(r.value)}>
    <div class="row between small" style="margin-bottom:3px"><span class="trunc" style="max-width:70%">${r.label}</span><span class="mono muted">${fmtv(r.value)}${unit || ""}</span></div>
    <div class="bar"><i style=${`width:${Math.max(0.5, (r.value / m) * 100)}%;background:${r.color || "var(--primary)"};border-radius:4px`}></i></div></div>`)}</div>`;
}
function Donut({ parts, size = 132, label, sub }) {
  const total = parts.reduce((a, p) => a + p.value, 0) || 1, r = size / 2 - 11, c = 2 * Math.PI * r;
  let off = 0;
  return html`<svg class="chart" width=${size} height=${size} viewBox=${`0 0 ${size} ${size}`} role="img" aria-label=${parts.map((p) => p.label + " " + p.value).join(", ")}>
    <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke="var(--muted)" stroke-width="12" />
    ${parts.filter((p) => p.value > 0).map((p) => { const len = (p.value / total) * c, el = html`<circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${p.color} stroke-width="12" stroke-dasharray=${`${Math.max(0, len - 2)} ${c}`} stroke-dashoffset=${-off} transform=${`rotate(-90 ${size / 2} ${size / 2})`} data-tip=${p.label + ": " + p.value + " (" + fmt.pct(p.value / total) + ")"}><//>`; off += len; return el; })}
    <text x="50%" y="48%" text-anchor="middle" style="font-size:20px;font-weight:600;fill:var(--foreground)">${label}</text>
    ${sub && html`<text x="50%" y="62%" text-anchor="middle">${sub}</text>`}</svg>`;
}
function Spark({ values, w = 120, h = 28, color = "var(--primary)" }) {
  if (!values.length) return null;
  const mx = Math.max(...values, 1), step = w / Math.max(values.length - 1, 1);
  const pts = values.map((v, i) => `${(i * step).toFixed(1)},${(h - 3 - (v / mx) * (h - 6)).toFixed(1)}`).join(" ");
  return html`<svg class="chart" width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} aria-hidden="true"><polyline points=${pts} fill="none" stroke=${color} stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /></svg>`;
}
/** Stage waterfall: one bar per stage positioned on the run's timeline. */
function Waterfall({ stages, order }) {
  const items = order.map((s) => ({ s, st: stages[s.id] })).filter((x) => x.st && x.st.startedAt);
  if (!items.length) return html`<div class="muted small">No stage timings yet.</div>`;
  const t0 = Math.min(...items.map((x) => x.st.startedAt)), t1 = Math.max(...items.map((x) => x.st.endedAt || Date.now() / 1000));
  const span = Math.max(t1 - t0, 0.001);
  return html`<div class="col" style="gap:7px">${items.map(({ s, st }, i) => {
    const left = ((st.startedAt - t0) / span) * 100, w = Math.max(0.8, (((st.endedAt || Date.now() / 1000) - st.startedAt) / span) * 100);
    return html`<div class="row" style="gap:10px"><div class="small trunc" style="width:150px;flex:none">${s.name}</div>
      <div class="grow" style="position:relative;height:14px;background:var(--muted);border-radius:4px" data-tip=${s.name + ": " + fmt.ms(st.ms ?? ((Date.now() / 1000 - st.startedAt) * 1000))}>
        <i style=${`position:absolute;left:${left}%;width:${Math.min(w, 100 - left)}%;top:0;bottom:0;border-radius:4px;background:${SERIES[i % 8]};opacity:${st.status === "running" ? 0.65 : 1}`}></i></div>
      <div class="mono small muted" style="width:70px;text-align:right;flex:none">${st.ms != null ? fmt.ms(st.ms) : "…"}</div></div>`;
  })}</div>`;
}
function Heat({ rows, cols, matrix, label }) {
  const mx = Math.max(1, ...matrix.flat());
  return html`<div class="table-wrap"><table class="t heat" aria-label=${label}><thead><tr><th>actual \\ predicted</th>${cols.map((c) => html`<th style="text-align:center">${c}</th>`)}</tr></thead>
    <tbody>${rows.map((r, i) => html`<tr><td class="muted">${r}</td>${matrix[i].map((v, j) => html`<td style=${`background:color-mix(in srgb, ${i === j ? "var(--ok)" : "var(--err)"} ${Math.round((v / mx) * 38)}%, transparent);font-weight:${v ? 600 : 400}`}>${v || html`<span class="faint">0</span>`}</td>`)}</tr>`)}</tbody></table></div>`;
}

/* ========================================================================================
   actions: everything the UI can execute
   ======================================================================================== */
const ABLATIONS = [
  ["Default (all switches on)", {}],
  ["No workflow-run alignment", { USE_RUN_ALIGNMENT: false }],
  ["Lenient time model", { STRICT_TIME: false }],
  ["No lineage propagation", { USE_LINEAGE: false }],
  ["No activity state checks", { USE_ACTIVITY_CHECKS: false }],
  ["No ghost sweep", { USE_GHOST_SWEEP: false }],
  ["Legacy earlier-request cut-off (all users)", { PARTITION_SINGLE_CASE_USERS_ONLY: false }],
];

function expectedStages(cfg, hasGold) {
  const ids = ["evidence", "catalog", "intent", "linking", "ghost", "solve"];
  if (cfg.mode === "hybrid" && cfg.vision) ids.unshift("vision");
  if (cfg.mode === "hybrid" && cfg.flags.USE_INVESTIGATOR) ids.splice(ids.indexOf("ghost"), 0, "investigator");
  if (hasGold) ids.push("scoring");
  return ids;
}
function resetRun(label, cfg, hasGold) {
  const stages = {};
  expectedStages(cfg, hasGold).forEach((id) => { stages[id] = { status: "pending" }; });
  Store.set({ run: { status: "running", stages, logs: [{ t: Date.now() / 1000, level: "info", msg: label }], llm: [], startedAt: Date.now() / 1000, finishedAt: null, error: null, label } });
}
function resolveGold(cfg, info) {
  if (cfg.gold === "none") return null;
  if (cfg.gold !== "auto") return cfg.gold;
  const g = (info && info.gold) || [];
  const samples = cfg.requestsFile === "sample_deletion_requests.csv";
  return (samples ? g.find((x) => x === "sample_output.csv") : g.find((x) => x !== "sample_output.csv")) || null;
}

const Actions = {
  async prepare(mode) {
    await Engine.start();
    if (mode === "hybrid") await Vault.pushEnv();
  },

  async runAudit() {
    const s = Store.get();
    if (s.run.status === "running") return;
    const ds = s.datasets[s.activeDataset];
    if (!ds || !ds.info || !ds.info.ok) { toast("Select a complete dataset first (deletion_requests, identities, audit log, activity, rules, manifest).", "error"); return; }
    const cfg = s.cfg, gold = resolveGold(cfg, ds.info);
    resetRun(`Audit: ${ds.name} (${cfg.mode})`, cfg, !!gold);
    try {
      await Actions.prepare(cfg.mode);
      await Datasets.ensure(ds.id);
      const opts = { data: "/app/data/" + ds.id, requests_file: cfg.requestsFile, mode: cfg.mode, vision: cfg.vision, flags: cfg.flags, gold, limit: cfg.limit ? Number(cfg.limit) : null, refresh_llm: cfg.refresh, sort: cfg.sort, pool_samples: cfg.poolSamples };
      const res = await Engine.callJson("run_audit", JSON.stringify(opts));
      res.meta = { dataset: ds.name, finishedAt: Date.now() / 1000, gold, cfg: { ...cfg, flags: { ...cfg.flags } } };
      Store.set((st) => ({ result: res, run: { ...st.run, status: "done", finishedAt: Date.now() / 1000 }, history: [{ id: uid(), at: Date.now(), dataset: ds.name, mode: cfg.mode, summary: res.summary, metrics: res.metrics }, ...st.history].slice(0, 20) }));
      toast(`Audit finished: ${res.summary.cases} ${res.summary.cases === 1 ? "case" : "cases"} in ${fmt.ms(res.summary.duration_ms)}`, "ok");
    } catch (e) {
      if (String(e.message) === "cancelled") return;
      Store.set((st) => ({ run: { ...st.run, status: "error", error: e.message, finishedAt: Date.now() / 1000 } }));
      toast("Run failed: " + e.message.split("\n").slice(-2)[0], "error", 8000);
    }
  },

  async cancel() {
    Store.set((st) => ({ run: { ...st.run, status: "cancelled", finishedAt: Date.now() / 1000, logs: [...st.run.logs, { t: Date.now() / 1000, level: "warn", msg: "Cancelled - restarting the engine worker" }] }, tools: { ...st.tools, busy: null } }));
    toast("Cancelled. Restarting the engine (Python runs in a worker and can only be stopped by restarting it).", "info", 6000);
    Engine.restart().then(async () => { await Vault.pushEnv(); const id = Store.get().activeDataset; if (id) Datasets.ensure(id).catch(() => {}); }).catch(() => {});
  },

  async ensureDemoSuite() {
    await Engine.start();
    if (Engine.loaded.has("__demo_suite")) return;
    const enc = new TextEncoder(), files = [];
    for (const [name, fs] of Object.entries(DEMO)) for (const [p, t] of Object.entries(fs)) files.push({ path: "demo_suite/" + name + "/" + p, data: enc.encode(t).buffer });
    await Engine.write(files);
    Engine.loaded.add("__demo_suite");
  },

  async runSuite() {
    if (Store.get().tools.busy) return;
    Store.set((st) => ({ tools: { ...st.tools, busy: "suite" } }));
    resetRun("Demo suite: 8 end-to-end scenarios", { mode: "offline", flags: FLAG_DEFAULTS, vision: false }, true);
    try {
      await Actions.ensureDemoSuite();
      const res = await Engine.callJson("run_custom_suite", "/app/data/demo_suite");
      Store.set((st) => ({ tools: { ...st.tools, suite: res, busy: null }, run: { ...st.run, status: "done", finishedAt: Date.now() / 1000 } }));
      const ok = res.datasets.filter((d) => d.exact).length;
      toast(`Demo suite: ${ok}/${res.datasets.length} scenarios exactly match their expected output`, ok === res.datasets.length ? "ok" : "error");
    } catch (e) { Store.set((st) => ({ tools: { ...st.tools, busy: null }, run: { ...st.run, status: "error", error: e.message } })); toast("Suite failed: " + e.message.slice(-120), "error"); }
  },

  async runAblation() {
    const s = Store.get(); const ds = s.datasets[s.activeDataset];
    if (!ds || !ds.info?.ok) { toast("Select a dataset first", "error"); return; }
    const gold = resolveGold(s.cfg, ds.info);
    if (s.tools.busy) return;
    Store.set((st) => ({ tools: { ...st.tools, busy: "ablation", ablation: null } }));
    resetRun("Ablation: " + ds.name, { mode: "offline", flags: FLAG_DEFAULTS, vision: false }, !!gold);
    try {
      await Datasets.ensure(ds.id);
      const configs = ABLATIONS.map(([name, flags]) => ({ name, flags }));
      const res = await Engine.callJson("run_ablation", JSON.stringify({ data: "/app/data/" + ds.id, gold, requests_file: s.cfg.requestsFile, configs }));
      Store.set((st) => ({ tools: { ...st.tools, ablation: { ...res, dataset: ds.name, gold }, busy: null }, run: { ...st.run, status: "done", finishedAt: Date.now() / 1000 } }));
      toast("Ablation finished", "ok");
    } catch (e) { Store.set((st) => ({ tools: { ...st.tools, busy: null }, run: { ...st.run, status: "error", error: e.message } })); toast("Ablation failed: " + e.message.slice(-120), "error"); }
  },

  async runRecovery(folds, repeats) {
    const s = Store.get(); const ds = s.datasets[s.activeDataset];
    if (!ds || !ds.info?.ok) { toast("Select a dataset first", "error"); return; }
    if (s.tools.busy) return;
    Store.set((st) => ({ tools: { ...st.tools, busy: "recovery", recovery: null } }));
    resetRun("Link-recovery test: " + ds.name, { mode: "offline", flags: FLAG_DEFAULTS, vision: false }, false);
    try {
      await Datasets.ensure(ds.id);
      const res = await Engine.callJson("run_recovery", JSON.stringify({ data: "/app/data/" + ds.id, folds, repeats, flags: s.cfg.flags }));
      Store.set((st) => ({ tools: { ...st.tools, recovery: { ...res, dataset: ds.name }, busy: null }, run: { ...st.run, status: "done", finishedAt: Date.now() / 1000 } }));
      toast("Link-recovery test finished", "ok");
    } catch (e) { Store.set((st) => ({ tools: { ...st.tools, busy: null }, run: { ...st.run, status: "error", error: e.message } })); toast("Recovery test failed: " + e.message.slice(-120), "error"); }
  },

  async testKey(item) {
    try {
      await Engine.start();
      const r = JSON.parse(await Engine.call("test_key", item.provider, item.secret || "none", item.base_url || ""));
      return r;
    } catch (e) { return { ok: false, error: e.message.slice(-140) }; }
  },
};

function repoUrl() {
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  if (m) { const repo = location.pathname.split("/").filter(Boolean)[0]; return `https://github.com/${m[1]}/${repo || m[1] + ".github.io"}`; }
  return null;
}
function defaultDatasetUrl() {
  const m = location.hostname.match(/^(.+)\.github\.io$/);
  if (m) { const repo = location.pathname.split("/").filter(Boolean)[0]; return `https://raw.githubusercontent.com/${m[1]}/${repo || ""}/main/dataset/`; }
  return location.origin + location.pathname.replace(/[^/]*$/, "") + "../dataset/";
}

  const label = { idle: "idle", pending: "queued", running: "working", done: "done", failed: "failed", skipped: "off for this run" };
  const kind = { done: "ok", running: "primary", failed: "err", skipped: "", idle: "", pending: "" };
  const cur = STAGES.find((s) => s.id === sel);

    <div class="agents" role="list">${STAGES.map((s, i) => { const status = stageStatus(s); const st = run.stages[s.id];

          ${st && st.total && html`<div style="margin-top:8px"><${Progress} value=${(st.done || 0) / st.total} /></div>`}</button>`; })}</div>
    <div class="grid g2" style="align-items:start">
      <${Card} title=${cur.name} icon=${cur.icon} sub=${cur.llm ? "May use an LLM (guarded)" : "Deterministic"} actions=${html`<${Badge} kind=${kind[stageStatus(cur)]}>${label[stageStatus(cur)]}<//>`}>
        <div class="col"><p>${cur.role}</p>
          ${cur.needs && html`<div class="hint">Active when: ${cur.needs}</div>`}
          ${cst?.stats && Object.keys(cst.stats).length > 0 && html`<dl class="kv">${Object.entries(cst.stats).map(([k, v]) => html`<dt>${k.replace(/_/g, " ")}</dt><dd class="mono">${typeof v === "object" ? JSON.stringify(v) : String(v)}</dd>`)}</dl>`}
          ${cst?.ms != null && html`<div class="small muted">Last duration: <span class="mono">${fmt.ms(cst.ms)}</span></div>`}
          ${!cst && html`<div class="hint">Run an audit to see live statistics for this agent.</div>`}</div><//>
      <${Card} title="Guardrails & principles" icon="shield-check">
        <ul class="col small" style="margin:0;padding-left:18px;gap:8px">
          <li><b>Claims are not proof.</b> Reported statuses and activity results never decide a state; only evidence captured by <span class="mono">audit_at</span> does.</li>

function usePreview(id, ok) {
  const [p, setP] = useState(null), [err, setErr] = useState(null);
  useEffect(() => {
    let live = true; setP(null); setErr(null);
    if (!id || !ok) return;
    (async () => { try { const v = await Engine.callJson("dataset_preview", "/app/data/" + id); if (live) setP(v); } catch (e) { if (live) setErr(e.message.slice(-160)); } })();
    return () => { live = false; };
  }, [id, ok]);
  return [p, err];
}

/* ---------------------------------------------------------------- Evaluation */
function MetricsPanel({ res }) {
  const m = res.metrics;

  const labels = ["COMPLETE", "INCOMPLETE", "NOT_APPLICABLE"];
  const mat = labels.map(() => labels.map(() => 0));

    <div class="grid g4 keep2"><${Stat} k="Status accuracy" v=${fmt.pct(m.status_acc)} d=${`${m.status}/${m.n} cases`} icon="circle-check" tip="Share of cases whose deletion_status equals the gold status" />

      <${Stat} k="Step recall" v=${fmt.pct(m.recall)} d="gold steps recovered" icon="search" tip="Matched steps / gold steps" />
      <${Stat} k="Step F1" v=${fmt.pct(m.f1)} d=${`exact sequence ${m.exact}/${m.n}`} icon="gauge" /></div>
    <div class="grid g2" style="align-items:start">

        <div class="sep" style="margin:14px 0"></div><${HBars} rows=${[{ label: "Position accuracy (step_no)", value: m.position_acc, color: SERIES[4] }, { label: "Kendall tau (relative order)", value: m.kendall_tau, color: SERIES[5] }, { label: "LCS ratio", value: m.lcs_ratio, color: SERIES[6] }]} max=${1} fmtv=${(v) => fmt.pct(v)} /><//>
      <${Card} title="Status confusion matrix" sub="Rows: gold · columns: predicted" icon="layers"><${Heat} rows=${labels} cols=${labels} matrix=${mat} label="status confusion matrix" />
        <div class="hint" style="margin-top:10px">Unreachable ceiling: ${m.unreach} gold step(s) name resources that appear nowhere in participant-visible data.</div><//></div>
    <${Card} title=${`Cases that differ from gold (${bad.length})`} icon="triangle-alert">${bad.length === 0 ? html`<${Banner} kind="ok"><div class="small">Every scored case matches exactly.</div><//>` :
      html`<div class="table-wrap"><table class="t"><thead><tr><th>Case</th><th>Status</th><th class="num">Missing</th><th class="num">Extra</th></tr></thead><tbody>${bad.map((c) => html`<tr class="click" onClick=${() => Store.set({ view: "results", selectedCase: c.case_id })}><td class="mono strong">${c.case_id}</td>
        <td>${c.gold.status_ok ? html`<${Badge} kind="ok">ok<//>` : html`<${Badge} kind="err">${c.status} vs ${c.gold.gold_status}<//>`}</td><td class="num">${c.gold.missing.length}</td><td class="num">${c.gold.extra.length}</td></tr>`)}</tbody></table></div>`}<//></div>`;

/* ---------------------------------------------------------------- Monitor */
function MonitorView() {

  const lat = fresh.map((c) => c.ms).filter(Boolean), avg = lat.length ? lat.reduce((a, b) => a + b, 0) / lat.length : 0;
  const cost = res?.llm.by_model.reduce((a, m) => a + m.cost_if_uncached, 0) || 0;
  const byTask = {}; calls.forEach((c) => { const t = (byTask[c.task] = byTask[c.task] || { n: 0, tok: 0 }); t.n++; t.tok += (c.in || 0) + (c.out || 0); });

      <div class="row"><button class="btn outline sm" onClick=${() => download("events.log", run.logs.map((l) => `${new Date(l.t * 1000).toISOString()} ${l.level.padEnd(5)} ${l.msg}`).join("\n"))}><${Icon} n="download" cls="sm" />Download log</button></div></div>
    <div class="grid g4 keep2">
      <${Stat} k="Engine" v=${eng.status === "ready" ? "Ready" : eng.status === "booting" ? "Starting" : eng.status === "error" ? "Error" : "Idle"} d=${eng.info ? "Python " + eng.info.python + (eng.info.pdf ? " · pypdf" : " · no PDF") : ""} icon="cpu" color=${eng.status === "ready" ? "var(--ok)" : eng.status === "error" ? "var(--err)" : undefined} />
      <${Stat} k="Run" v=${{ idle: "Idle", running: "Running", done: "Done", error: "Failed", cancelled: "Cancelled" }[run.status]} d=${run.finishedAt && run.startedAt ? fmt.ms((run.finishedAt - run.startedAt) * 1000) : run.label} icon="activity" />
      <${Stat} k="Model calls" v=${calls.length} d=${`${fresh.length} fresh · ${cached.length} cached`} icon="brain" />
      <${Stat} k="Tokens in / out" v=${fmt.num(tin) + " / " + fmt.num(tout)} d=${`avg latency ${fmt.ms(avg)} · est. ${fmt.usd(cost)} if uncached`} icon="coins" /></div>
    <div class="grid g2" style="align-items:start">
      <${Card} title="Stage timeline" sub="When each agent ran in this run" icon="timer"><${Waterfall} stages=${run.stages} order=${STAGES} /><//>
      <${Card} title="Model activity" icon="brain" sub=${prov.length ? "Providers: " + prov.join(" → ") : "No providers loaded (offline)"}>
        ${calls.length === 0 ? html`<div class="hint">No model calls in this run.</div>` : html`<div class="col"><${HBars} rows=${Object.entries(byTask).map(([k, v], i) => ({ label: k + " · " + v.n + " calls", value: v.tok, color: SERIES[i % 8] }))} fmtv=${(v) => fmt.num(v) + " tok"} />
          <div class="row" style="gap:14px"><span class="small muted">Latency</span><${Spark} values=${lat} w=${200} /></div></div>`}<//></div>
    ${calls.length > 0 && html`<${Card} title="Model call ledger" icon="list"><div class="table-wrap" style="max-height:300px"><table class="t"><thead><tr><th>Time</th><th>Task</th><th>Provider / model</th><th class="num">In</th><th class="num">Out</th><th class="num">Latency</th><th>Result</th></tr></thead><tbody>${calls.slice(-200).reverse().map((c) => html`<tr>
      <td class="mono small">${fmt.time(c.t)}</td><td class="mono small">${c.task}</td><td class="small">${c.provider || "-"} <span class="muted">${c.model || ""}</span></td><td class="num">${c.in ?? 0}</td><td class="num">${c.out ?? 0}</td><td class="num">${c.cached ? "-" : fmt.ms(c.ms)}</td>
      <td>${c.cached ? html`<${Badge}>cache<//>` : c.ok ? html`<${Badge} kind="ok">ok<//>` : html`<${Badge} kind="err">failed<//>`}</td></tr>`)}</tbody></table></div><//>`}
    ${flags.length > 0 && html`<${Card} title="Review flags" sub="Cases a human may want to look at (informational flags excluded)" icon="triangle-alert"><${HBars} rows=${flags.map(([k, v], i) => ({ label: k, value: v, color: SERIES[i % 8] }))} /><//>`}
    <${Card} title="Event log" icon="terminal" actions=${html`<div class="row"><select class="select" style="width:auto;height:30px" aria-label="Level" value=${lv} onChange=${(e) => setLv(e.target.value)}><option value="all">all levels</option><option value="info">info</option><option value="stage">stage</option><option value="llm">llm</option><option value="warn">warn</option><option value="error">error</option></select><input class="input" style="height:30px;width:150px" placeholder="filter…" aria-label="Filter log" value=${q} onInput=${(e) => setQ(e.target.value)} /></div>`}>
      <${LogView} logs=${logs} max=400 height=340 /><//></div>`;

function strength(p) {
  let s = 0; if (p.length >= 8) s++; if (p.length >= 12) s++; if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++; if (/\d/.test(p)) s++; if (/[^\w\s]/.test(p)) s++;
  return Math.min(4, Math.max(p ? 1 : 0, s - (p.length < 8 ? 1 : 0)));
}

}

    ${p.needsUrl && html`<label class="field">Base URL (OpenAI-compatible, ends before /chat/completions)<input class="input mono" value=${base} placeholder="https://openrouter.ai/api/v1  or  http://localhost:11434/v1" onInput=${(e) => setBase(e.target.value)} /></label>`}
    <div class="grid g2"><label class="field">Model override (optional)<input class="input mono" value=${model} placeholder=${p.model} onInput=${(e) => setModel(e.target.value)} /></label>
      <label class="field">Vision model (optional)<input class="input mono" value=${vmodel} placeholder="provider default" onInput=${(e) => setVmodel(e.target.value)} /></label></div>
    <div class="hint">Sent only to <span class="mono">${prov === "custom" ? (base || "your endpoint") : p.host}</span>, directly from your browser. ${p.note || ""}</div>
    ${test && html`<${Banner} kind=${test.ok ? "ok" : "err"}><div class="small">${test.ok ? `Key works: ${test.count} models visible (${(test.models || []).slice(0, 3).join(", ")}…)` : "Test failed: " + test.error}</div><//>`}
    <div class="row between wrap"><button class="btn outline" disabled=${!valid || busy || !ready || busyRun} onClick=${async () => { setBusy(true); setTest(await Actions.testKey(item())); setBusy(false); }}>${busy ? html`<${Icon} n="loader-circle" cls="sm spin" />` : html`<${Icon} n="zap" cls="sm" />`}Test key</button>
      <div class="row"><button class="btn ghost" onClick=${onClose}>Cancel</button><button class="btn" disabled=${!valid} onClick=${async () => { await Vault.add(item()); toast("Key stored in the vault", "ok"); onClose(); }}><${Icon} n="lock" cls="sm" />Store key</button></div></div></div><//>`;
}

function VaultView() {
  const v = useStore((s) => s.vault), prefs = useStore((s) => s.prefs), ready = useStore((s) => s.engine.status === "ready");
  const [pass, setPass] = useState(""), [pass2, setPass2] = useState(""), [err, setErr] = useState(""), [adding, setAdding] = useState(false), [tests, setTests] = useState({}), [working, setWorking] = useState(false);
  const impRef = useRef();
  const order = prefs.providerOrder || ["anthropic", "openai", "gemini", "groq", "custom"];
  const move = (p, d) => { const a = [...order]; const i = a.indexOf(p), j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; setPrefs({ providerOrder: a }); Vault.pushEnv(); };
  const st = strength(pass);
  const create = async () => { setErr(""); if (pass.length < 8) return setErr("Use at least 8 characters."); if (pass !== pass2) return setErr("Passphrases do not match."); setWorking(true); try { await Vault.create(pass); setPass(""); setPass2(""); toast("Vault created and unlocked", "ok"); } catch (e) { setErr(e.message); } setWorking(false); };
  const unlock = async () => { setErr(""); setWorking(true); try { await Vault.unlock(pass); setPass(""); toast("Vault unlocked", "ok"); } catch (e) { setErr(e.message); } setWorking(false); };
  const unlocked = v.phase === "unlocked" || v.phase === "session";
  return html`<div class="page"><div class="row between wrap"><div><h1>Vault</h1><p class="muted small" style="margin-top:4px">Bring your own provider keys to run the hybrid (LLM) mode. Nothing is sent to any server of ours - there isn't one.</p></div>
      ${unlocked && html`<div class="row"><${Badge} kind="ok"><${Icon} n="lock-open" cls="sm" />${v.phase === "session" ? "session only" : "unlocked"}<//><button class="btn outline sm" onClick=${() => Vault.lock()}><${Icon} n="lock" cls="sm" />Lock now</button></div>`}</div>
    ${v.error && html`<${Banner} kind="warn"><div class="small">${v.error}</div><//>`}
    ${v.phase === "none" && html`<div class="grid g2" style="align-items:start"><${Card} title="Create an encrypted vault" icon="lock" sub="Keys are stored in this browser, encrypted with your passphrase">
        <div class="col"><${PassField} label="Passphrase" value=${pass} onInput=${setPass} autoComplete="new-password" />
          <div class="row" style="gap:4px" aria-label="Passphrase strength">${[1, 2, 3, 4].map((i) => html`<i style=${`flex:1;height:4px;border-radius:2px;background:${i <= st ? ["", "var(--err)", "var(--warn)", "var(--info)", "var(--ok)"][st] : "var(--muted)"}`}></i>`)}</div>
          <${PassField} label="Repeat passphrase" value=${pass2} onInput=${setPass2} autoComplete="new-password" />
          ${err && html`<div class="small" style="color:var(--err)">${err}</div>`}
          <button class="btn" disabled=${working} onClick=${create}>${working ? html`<${Icon} n="loader-circle" cls="sm spin" />` : html`<${Icon} n="key-round" cls="sm" />`}Create vault</button>
          <div class="hint">There is no recovery: a forgotten passphrase means re-entering your keys (the encrypted blob is useless without it).</div></div><//>
      <${Card} title="Or: session only" icon="clock" sub="Nothing is written to storage"><div class="col"><p class="small">Keys live in this tab's memory and vanish when you close or reload it. Best for shared computers.</p><button class="btn outline" onClick=${() => Vault.sessionOnly()}><${Icon} n="timer" cls="sm" />Use a session-only vault</button></div><//></div>`}
    ${v.phase === "locked" && html`<${Card} title="Vault locked" icon="lock" sub=${`${v.items.length} key(s) stored`}><div class="col" style="max-width:420px">
        <${PassField} label="Passphrase" value=${pass} onInput=${setPass} autoComplete="current-password" id="unlock-pass" />${err && html`<div class="small" style="color:var(--err)">${err}</div>`}
        <div class="row"><button class="btn" disabled=${working || !pass} onClick=${unlock}>${working ? html`<${Icon} n="loader-circle" cls="sm spin" />` : html`<${Icon} n="lock-open" cls="sm" />`}Unlock</button>
          <button class="btn danger" onClick=${() => { if (confirm("Delete the vault and every stored key from this browser?")) Vault.wipe(); }}><${Icon} n="trash-2" cls="sm" />Wipe vault</button></div>
        <div class="list">${v.items.map((i) => html`<div class="row small muted"><${Icon} n="key-round" cls="sm" />${PROVIDERS[i.provider]?.name} · ${i.label}</div>`)}</div></div><//>`}
    ${unlocked && html`<${Card} title="Stored keys" icon="key-round" actions=${html`<button class="btn sm" onClick=${() => setAdding(true)}><${Icon} n="plus" cls="sm" />Add key</button>`}>
        ${v.items.length === 0 ? html`<${Empty} icon="key-round" title="No keys yet">Add a key for Anthropic, OpenAI, Gemini, Groq or any OpenAI-compatible endpoint.<//>` : html`<div class="col">${v.items.map((i) => html`<div class="card flat" style="padding:12px"><div class="row wrap" style="gap:12px">
          <div class="grow" style="min-width:200px"><div class="strong">${i.label}</div><div class="small muted">${PROVIDERS[i.provider]?.name} · <span class="mono">${Vault.mask(i.secret)}</span>${i.model ? " · " + i.model : ""}${i.base_url ? " · " + i.base_url : ""}</div></div>
          ${tests[i.id] && html`<${Badge} kind=${tests[i.id].ok ? "ok" : "err"} tip=${tests[i.id].error || ""}>${tests[i.id].ok ? tests[i.id].count + " models" : "failed"}<//>`}
          <button class="btn outline sm" disabled=${!ready} onClick=${async () => { setTests({ ...tests, [i.id]: { pending: true } }); const r = await Actions.testKey(i); setTests((t) => ({ ...t, [i.id]: r })); }}><${Icon} n="zap" cls="sm" />Test</button>
          <button class="btn ghost icon-only sm" aria-label=${"Remove " + i.label} onClick=${() => Vault.remove(i.id)}><${Icon} n="trash-2" cls="sm" /></button></div></div>`)}</div>`}<//>
      <div class="grid g2" style="align-items:start"><${Card} title="Provider priority" sub="Tried in this order; later ones are fallbacks" icon="workflow"><div class="col gap-sm">${order.map((p, i) => html`<div class="row"><span class="mono tiny faint" style="width:18px">${i + 1}</span><span class="grow">${PROVIDERS[p].name}</span>${v.providers.includes(p) ? html`<${Badge} kind="ok">active<//>` : html`<${Badge}>no key<//>`}
          <button class="btn ghost icon-only sm" aria-label="Move up" disabled=${i === 0} onClick=${() => move(p, -1)}><${Icon} n="chevron-down" cls="sm flip" /></button><button class="btn ghost icon-only sm" aria-label="Move down" disabled=${i === order.length - 1} onClick=${() => move(p, 1)}><${Icon} n="chevron-down" cls="sm" /></button></div>`)}</div><//>
        <${Card} title="Security" icon="shield-check"><div class="col">
          ${v.phase === "unlocked" && html`<label class="field">Auto-lock after idle<select class="select" value=${prefs.lockMin} onChange=${(e) => { setPrefs({ lockMin: +e.target.value }); Vault.touch(); }}>${[[0, "Never"], [5, "5 minutes"], [10, "10 minutes"], [30, "30 minutes"], [60, "1 hour"]].map(([m, l]) => html`<option value=${m}>${l}</option>`)}</select></label>`}
          <div class="row wrap"><button class="btn outline sm" disabled=${v.phase !== "unlocked"} onClick=${() => download("gda-vault-export.json", Vault.exportBlob(), "application/json")}><${Icon} n="download" cls="sm" />Export (encrypted)</button>
            <button class="btn outline sm" onClick=${() => impRef.current.click()}><${Icon} n="upload" cls="sm" />Import</button>
            <button class="btn danger sm" onClick=${() => { if (confirm("Delete the vault and every stored key from this browser?")) Vault.wipe(); }}><${Icon} n="trash-2" cls="sm" />Wipe</button></div>
          <input ref=${impRef} type="file" accept="application/json" hidden onChange=${async (e) => { try { Vault.importBlob(await e.target.files[0].text()); toast("Vault imported - unlock it with its passphrase", "ok"); } catch (x) { toast(x.message, "error"); } }} /></div><//></div>`}
    <${Card} title="How your keys are protected" icon="shield-check"><ul class="col small" style="margin:0;padding-left:18px;gap:8px">
      <li><b>Encrypted at rest.</b> AES-256-GCM with a key derived from your passphrase by PBKDF2-SHA256 (310,000 iterations, random salt). Only ciphertext is stored in this browser's localStorage.</li>
      <li><b>In memory only while unlocked.</b> Locking (manually or by idle timeout) discards the decrypted keys and clears them from the engine worker.</li>
      <li><b>Direct to the provider.</b> Calls go from your browser to the provider's API over HTTPS. This page has no backend and loads no analytics; its content-security policy only allows HTTPS (and localhost) connections.</li>
      <li><b>Never logged.</b> Keys are not written to the event log, the exports, run.json or the LLM cache; only fingerprints are used inside the engine.</li>
      <li><b>Honest limits.</b> Anyone with access to this unlocked browser tab can use the keys; browser extensions with page access can read them. Use keys with spending limits, and prefer session-only on shared machines.</li></ul>
      <div class="sep" style="margin:14px 0"></div><div class="small muted">Endpoints this page may contact</div><div class="row wrap" style="margin-top:6px">${Object.values(PROVIDERS).filter((p) => !p.needsUrl).map((p) => html`<${Badge} mono=${true}>${p.host}<//>`)}<${Badge} mono=${true}>cdn.jsdelivr.net (Python runtime)<//><${Badge} mono=${true}>pypi.org (pypdf)<//></div><//>
    ${adding && html`<${AddKeyDialog} onClose=${() => setAdding(false)} />`}</div>`;
}

function GuideView() {
  const gh = repoUrl();
  const docs = [["README.md", "Overview, quick start, headline numbers"], ["docs/ARCHITECTURE.md", "System architecture with diagrams"], ["docs/AGENTS.md", "Agent architecture and guardrails"], ["docs/ACCURACY.md", "Accuracy, precision, ablations, methodology"], ["docs/WEB_UI.md", "This interface: design, vault, deployment"], ["docs/DATA_AND_POLICY.md", "Inputs, outputs, policy engine, step contract"]];
  return html`<div class="page"><div><h1>Guide</h1><p class="muted small" style="margin-top:4px">How to use this interface, and where the documentation lives.</p></div>
    <div class="grid g2" style="align-items:start"><${Card} title="Quick start" icon="play"><ol class="col small" style="margin:0;padding-left:18px;gap:8px">
      <li>Wait for the engine badge (top bar) to turn <b>ready</b>. The Python runtime loads once and is cached.</li>
      <li>On <b>Run</b>, load a demo scenario - or upload the challenge <span class="mono">dataset/</span> folder (or a zip, or a URL).</li>
      <li>Choose <b>Offline</b> (deterministic, no keys) or <b>Hybrid</b> (adds the LLM layer; add keys in the Vault first).</li>
      <li>Press <b>Run audit</b> (<span class="kbd">Ctrl</span>+<span class="kbd">Enter</span>). Watch agents and the event log live.</li>
      <li>Explore <b>Results</b> case by case, check <b>Evaluation</b>, download <span class="mono">output.csv</span>, <span class="mono">trace.jsonl</span> and <span class="mono">review.md</span>.</li></ol><//>
      <${Card} title="What runs where" icon="cpu"><div class="col small"><p>The page runs the same Python package as the command line, compiled to WebAssembly (Pyodide) inside a Web Worker, so the interface stays responsive. Stopping a run restarts that worker.</p>
        <p>Datasets never leave your browser. In hybrid mode only request texts and screenshots you chose to analyse go to the provider you configured.</p><p>Full-dataset runs (518 cases, 94 evidence files) take roughly a minute in the browser; the demo scenarios take seconds.</p></div><//></div>
    <${Card} title="Documentation" icon="book-open" sub=${gh ? "Links open the repository on GitHub" : "Open these files in the repository"}><div class="grid g-auto" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${docs.map(([f, d]) => html`<${gh ? "a" : "div"} class="card flat" style="padding:12px;display:block;color:inherit;text-decoration:none" href=${gh ? gh + "/blob/main/" + f : null} target="_blank" rel="noopener"><div class="mono small strong">${f}</div><div class="hint">${d}</div><//>`)}</div><//>
    <${Card} title="Keyboard & accessibility" icon="terminal"><div class="small col"><div><span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> run the audit · <span class="kbd">Esc</span> close drawers and dialogs · <span class="kbd">Enter</span> open the focused table row.</div>
      <div>All controls are keyboard reachable, charts carry text alternatives, motion respects <i>prefers-reduced-motion</i>, and every colour state also has an icon or label.</div></div><//></div>`;
}

/* ========================================================================================
   App shell
   ======================================================================================== */
const NAV = [
  ["run", "Run", "play", "Execute the audit"],
  ["inputs", "Inputs", "database", "What is audited"],
  ["agents", "Agents", "bot", "Live pipeline"],
  ["results", "Results", "list", "Cases & plans"],
  ["evaluation", "Evaluation", "gauge", "Accuracy & tests"],
  ["monitor", "Monitor", "activity", "Tracing & logs"],
  ["vault", "Vault", "key-round", "Provider keys"],
  ["guide", "Guide", "book-open", "Docs"],
];

function ThemeMenu() {
  const prefs = useStore((s) => s.prefs);
  const [open, setOpen] = useState(false);
  const ref = useRef();
  useEffect(() => { if (!open) return; const f = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener("pointerdown", f); return () => document.removeEventListener("pointerdown", f); }, [open]);
  return html`<div style="position:relative" ref=${ref}>
    <button class="btn ghost icon-only" aria-label="Appearance" aria-expanded=${open} onClick=${() => setOpen(!open)}><${Icon} n="palette" /></button>
    ${open && html`<div class="menu" role="dialog" aria-label="Appearance"><div class="col" style="gap:14px">
      <div><div class="small muted" style="margin-bottom:6px">Base</div><div class="col" style="gap:4px">${THEMES.base.map(([k, l]) => html`<button class="nav-item" aria-current=${prefs.base === k ? "page" : null} onClick=${() => setPrefs({ base: k })}><${Icon} n=${k === "paper" ? "sun" : "moon"} cls="sm" /><span class="lbl">${l}</span></button>`)}</div></div>
      <div><div class="small muted" style="margin-bottom:6px">Accent</div><div class="row wrap">${THEMES.accent.map(([k, c]) => html`<button class="swatch" aria-label=${k} aria-pressed=${prefs.accent === k ? "true" : "false"} style=${"background:" + c} onClick=${() => setPrefs({ accent: k })}></button>`)}</div></div>
      <div><div class="small muted" style="margin-bottom:6px">Density</div><${Seg} label="Density" value=${prefs.density} onChange=${(v) => setPrefs({ density: v })} options=${[["comfortable", "Comfortable"], ["compact", "Compact"]]} /></div>
    </div></div>`}</div>`;
}

function EnginePill() {
  const eng = useStore((s) => s.engine), run = useStore((s) => s.run);
  const running = run.status === "running";
  const cur = Object.entries(run.stages).find(([, v]) => v.status === "running");
  const [k, t, d] = eng.status === "ready" ? (running ? ["primary", cur ? "working: " + cur[0] : "working", "run"] : ["ok", "engine ready", "ok"]) : eng.status === "error" ? ["err", "engine error", "err"] : ["warn", "engine starting", "run"];
  return html`<${Badge} kind=${k}><span class=${cls("dot", d)}></span><span class="hide-sm">${t}</span><span class="show-sm">${eng.status === "ready" ? (running ? "busy" : "ready") : "…"}</span><//>`;
}

function Toasts() {
  const ts = useStore((s) => s.toasts);
  return html`<div class="toasts" aria-live="polite">${ts.map((t) => html`<div class="toast"><${Icon} n=${{ ok: "circle-check", error: "circle-x", info: "info" }[t.kind] || "info"} /><div class="grow">${t.msg}</div></div>`)}</div>`;
}

function App() {
  const view = useStore((s) => s.view), prefs = useStore((s) => s.prefs), vault = useStore((s) => s.vault), res = useStore((s) => s.result), run = useStore((s) => s.run);
  useEffect(() => {
    const r = document.documentElement;
    r.dataset.base = prefs.base; r.dataset.accent = prefs.accent; r.dataset.density = prefs.density;
    document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.body).backgroundColor);
  }, [prefs.base, prefs.accent, prefs.density]);
  useEffect(() => { ls.set("gda.view", view); }, [view]);
  useEffect(() => {
    const f = (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); if (Store.get().view !== "vault") Actions.runAudit(); } };
    addEventListener("keydown", f); return () => removeEventListener("keydown", f);
  }, []);
  const go = (v) => { Store.set({ view: v }); document.querySelector(".main")?.scrollTo(0, 0); };
  const counts = { results: res ? res.cases.length : null };
  const locked = vault.phase === "locked" || vault.phase === "none";
  const View = { run: RunView, inputs: InputsView, agents: AgentsView, results: ResultsView, evaluation: EvaluationView, monitor: MonitorView, vault: VaultView, guide: GuideView }[view] || RunView;
  const gh = repoUrl();
  return html`<div class=${cls("app", !prefs.sidebar && "collapsed")}>
    <header class="topbar"><button class="btn ghost icon-only hide-sm" aria-label="Toggle sidebar" onClick=${() => setPrefs({ sidebar: !prefs.sidebar })}><${Icon} n="panel-left" /></button>
      <div class="brand"><div class="logo"><${Icon} n="ghost" /></div><div><span>Ghost Data Auditor</span><small class="hide-sm">deletion audit agent</small></div></div>
      <div class="spacer"></div><${EnginePill} />
      <button class="btn ghost sm" onClick=${() => go("vault")} aria-label=${locked ? "Vault locked" : "Vault unlocked"} data-tip=${locked ? "Vault locked / not created" : "Vault unlocked"}><${Icon} n=${locked ? "lock" : "lock-open"} cls="sm" /><span class="hide-sm">${vault.providers.length ? vault.providers.join(" · ") : "no keys"}</span></button>
      ${gh && html`<a class="btn ghost icon-only hide-sm" href=${gh} target="_blank" rel="noopener" aria-label="Repository"><${Icon} n="external-link" /></a>`}
      <${ThemeMenu} /></header>
    <nav class="sidebar" aria-label="Primary">${NAV.map(([k, l, ic, d], i) => html`${i === 6 && html`<div class="nav-sec">Setup</div>`}<button class="nav-item" aria-current=${view === k ? "page" : null} onClick=${() => go(k)} data-tip=${!prefs.sidebar ? l : null}><${Icon} n=${ic} /><span class="lbl">${l}</span>${counts[k] != null && html`<span class="count">${counts[k]}</span>`}${k === "run" && run.status === "running" && html`<span class="count"><span class="dot run"></span></span>`}</button>`)}
      <div class="spacer"></div><div class="hint hide-sm" style="padding:8px 10px;${prefs.sidebar ? "" : "display:none"}">Runs entirely in your browser.<br/>No server, no telemetry.</div></nav>
    <main class="main" id="main"><${View} /></main>
    <nav class="bottomnav" aria-label="Primary">${NAV.map(([k, l, ic]) => html`<button aria-current=${view === k ? "page" : null} onClick=${() => go(k)}><${Icon} n=${ic} /><span>${l}</span></button>`)}</nav>
    <${Toasts} /></div>`;
}

/* ---------- boot ---------- */
installTooltips();
Vault.init();
render(html`<${App} />`, document.getElementById("root"));
Engine.start().then(() => Vault.pushEnv()).catch(() => {});
if (new URLSearchParams(location.search).has("debug")) window.__gda = { Store, Engine, Datasets, Vault, Actions };   // test/automation handle (opt-in)

</script>
</body>
