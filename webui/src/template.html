<!doctype html>
<html lang="en" data-base="obsidian" data-accent="blue" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Ghost Data Auditor - run the deletion-audit engine in your browser: live agents, tracing, accuracy metrics and a local encrypted key vault.">
<meta name="generator" content="webui/build.py {{BUILD}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src https: http://localhost:* http://127.0.0.1:* blob: data:; base-uri 'none'; form-action 'none'">
<title>Ghost Data Auditor</title>
<link rel="icon" href="{{FAVICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
/* apply the saved theme before first paint */
try { var p = JSON.parse(localStorage.getItem("gda.prefs.v1") || "{}"); var r = document.documentElement;
  if (p.base) r.dataset.base = p.base; if (p.accent) r.dataset.accent = p.accent; if (p.density) r.dataset.density = p.density; } catch (e) {}
</script>
<style>
{{CSS}}
</style>
</head>
<body>
<div id="root"><div style="display:grid;place-items:center;height:100vh;color:#a1a1aa;font-family:system-ui">Loading Ghost Data Auditor…</div></div>
<noscript>This application needs JavaScript (it runs a Python engine in your browser).</noscript>
<script type="application/json" id="pysrc">{{PYSRC}}</script>
<script type="application/json" id="demo-data">{{DEMO}}</script>
<script type="text/plain" id="worker-src">{{WORKER}}</script>
<script>
{{VENDOR}}
</script>
<script>
const ICONS = {{ICONS}};
{{APP}}
</script>
</body>
</html>
